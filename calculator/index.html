<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <!-- Bootstrap Link CSS and Javascript -->
    <script src="https://cdn.jsdelivr.net" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!--Style css-->
     <link rel="stylesheet" href="style.css">
</head>
<body>
     <header>
       <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Javascript project</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link active" aria-current="page" href="/calculator/index.html">Calculator</a>
        <a class="nav-link active" aria-current="page" href="/img-slide/index.html">Image-Slide</a>
        <a class="nav-link active" aria-current="page" href="/timer/index.html">Timer</a>
        <a class="nav-link active" aria-current="page" href="/to-do list/index.html">To-do List</a>
        <a class="nav-link active" aria-current="page" href="/weather-app/index.html">Weather-App</a>
      
      </div>
    </div>
  </div>
</nav>
    </header>

  <div class="container d-flex flex-column align-items-center mt-4">

  <!-- display -->
  <input type="text" id="display" class="form-control text-end mb-2">

  <!-- buttons -->
  <div class="row g-2" style="max-width: 260px;">

    <div class="col-6">
      <button id="ac" class="btn btn-danger w-100">AC</button>
    </div>
    <div class="col-6"></div>

    <div class="col-3"><button id="b7" class="btn btn-dark w-100">7</button></div>
    <div class="col-3"><button id="b8" class="btn btn-dark w-100">8</button></div>
    <div class="col-3"><button id="b9" class="btn btn-dark w-100">9</button></div>
    <div class="col-3"><button id="divi" class="btn btn-warning w-100">÷</button></div>

    <div class="col-3"><button id="b4" class="btn btn-dark w-100">4</button></div>
    <div class="col-3"><button id="b5" class="btn btn-dark w-100">5</button></div>
    <div class="col-3"><button id="b6" class="btn btn-dark w-100">6</button></div>
    <div class="col-3"><button id="mult" class="btn btn-warning w-100">x</button></div>

    <div class="col-3"><button id="b1" class="btn btn-dark w-100">1</button></div>
    <div class="col-3"><button id="b2" class="btn btn-dark w-100">2</button></div>
    <div class="col-3"><button id="b3" class="btn btn-dark w-100">3</button></div>
    <div class="col-3"><button id="sub" class="btn btn-warning w-100">-</button></div>

    <div class="col-3"><button id="b0" class="btn btn-dark w-100">0</button></div>
    <div class="col-3"><button id="doc" class="btn btn-dark w-100">.</button></div>
    <div class="col-3"><button id="eq" class="btn btn-success w-100">=</button></div>
    <div class="col-3"><button id="add" class="btn btn-warning w-100">+</button></div>

  </div>
</div>
</body>

<!-- javascript code -->
<script src="script.js"></script>
</html>
