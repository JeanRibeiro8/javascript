<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FAVICON -->
<link rel="icon" type="image/png" href="/icon-js.png">

    <!-- Bootstrap Link CSS and Javascript -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!--Style css-->
     <link rel="stylesheet" href="/style.css">
</head>
<body>
     <header>
       <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/calculator/index.html">Javascript project</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav">
        <a class="nav-link active" aria-current="page" href="/calculator/calculator.html">Calculator</a>
        <a class="nav-link active" aria-current="page" href="/img-slide/imgslide.html">Image-Slide</a>
        <a class="nav-link active" aria-current="page" href="/timer/timer.html">Timer</a>
        <a class="nav-link active" aria-current="page" href="/to-do list/todolist.html">To-do List</a>
        <a class="nav-link active" aria-current="page" href="/weather-app/weather.html">Weather-App</a>
      
      </div>
    </div>
  </div>
</nav>
    </header>

  <main class="container d-flex justify-content-center align-items-center min-vh-100">

    <!-- CARD -->
    <div class="weather-card text-center p-4 rounded-4 shadow-lg">

      <h1 class="mb-4 fw-bold">
        Weather App
      </h1>

      <!-- INPUT -->
      <div class="input-group mb-4">

        <input
          type="text"
          id="city"
          class="form-control"
          placeholder="Enter city">

        <button id="searchBtn" class="btn btn-primary">

          <i class="bi bi-search"></i>

        </button>

      </div>

      <!-- WEATHER INFO -->
      <div id="weatherResult" class="d-none">

        <h2 id="cityName"></h2>

        <img id="weatherIcon" src="" alt="icon">

        <h3 id="temperature"></h3>

        <p id="description"></p>

        <div class="d-flex justify-content-around mt-4">

          <div>
            <h5>Humidity</h5>
            <p id="humidity"></p>
          </div>

          <div>
            <h5>Wind</h5>
            <p id="wind"></p>
          </div>

        </div>

      </div>

    </div>

  </main>
    
</body>

<style>

h1{
  color: #000000;
}

}
